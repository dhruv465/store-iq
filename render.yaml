services:
  - type: web
    name: store-iq
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      # The floor's memory (sessions, customer cards, follow-ups, the charges list) lives in Postgres
      # outside the service, so a deploy keeps it. The server will not start on Render without it.
      - key: DATABASE_URL
        sync: false
      - key: PACK_PATH
        value: data/pack.json
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      # Secrets are set in the Render dashboard, never committed.
      - key: GEMINI_API_KEY
        sync: false
      - key: WHATSAPP_GRAPH_VERSION
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      # Empty means any associate who messages the number gets a reply.
      - key: ALLOWED_PHONES
        value: ""
